name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Release
    runs-on: large
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check if prerelease
        id: check-prerelease
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "WARN: This is a prerelease"
          fi

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          SNAPSHOT_DATE="20260721T000000Z"
          echo "deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/${SNAPSHOT_DATE} resolute main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          echo "deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/${SNAPSHOT_DATE} resolute-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/${SNAPSHOT_DATE} resolute-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list

          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            cpio \
            curl \
            debian-archive-keyring \
            dosfstools \
            e2fsprogs \
            jq \
            make \
            pipx \
            systemd \
            ubuntu-keyring \
            zstd
          sudo env PIPX_HOME=/opt/pipx PIPX_BIN_DIR=/usr/local/bin \
            pipx install git+https://github.com/systemd/mkosi.git@84af20892b61c8e177e391f997ded8b4cb5514f2 #v26
          test "$(mkosi --version)" = "mkosi 26"

      - name: Install Bazel 8.7.0
        run: |
          set -Eeuo pipefail
          directory=$(mktemp -d /tmp/cvmimage-bazel-install.XXXXXXXX)
          archive="$directory/bazel"
          trap 'rm -f -- "$archive"; rmdir -- "$directory"' EXIT
          curl -fsSL --retry 3 \
            https://github.com/bazelbuild/bazel/releases/download/8.7.0/bazel-8.7.0-linux-x86_64 \
            -o "$archive"
          printf '%s  %s\n' \
            d7606e679b78067c811096fb3d6cf135225b528835ca396e3a4dddf957859544 \
            "$archive" | sha256sum -c --strict -
          sudo install -m 0755 "$archive" /usr/local/bin/bazel
          test "$(bazel --version)" = "bazel 8.7.0"

      - name: Build image
        run: make shipping-image

      - name: Check release artifacts
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/out
          test -s tinfoilcvm.raw
          test -s tinfoilcvm.initrd
          test -s tinfoilcvm.vmlinuz
          test "$(wc -c < tinfoilcvm.roothash)" -eq 64
          grep -Eq '^[a-f0-9]{64}$' tinfoilcvm.roothash

      - name: Generate manifest
        id: manifest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          # Generate manifest JSON
          cat > "/tmp/out/tinfoil-inference-${REF_NAME}-manifest.json" << EOF
          {
            "version": "${REF_NAME}",
            "root": "$(tr -d '\n' < tinfoilcvm.roothash)",
            "initrd": "$(sha256sum tinfoilcvm.initrd | awk '{print $1}')",
            "kernel": "$(sha256sum tinfoilcvm.vmlinuz | awk '{print $1}')",
            "raw": "$(sha256sum tinfoilcvm.raw | awk '{print $1}')",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          # Copy artifacts with versioned names
          cp tinfoilcvm.initrd "/tmp/out/tinfoil-inference-${REF_NAME}.initrd"
          cp tinfoilcvm.vmlinuz "/tmp/out/tinfoil-inference-${REF_NAME}.vmlinuz"
          cp tinfoilcvm.raw "/tmp/out/tinfoil-inference-${REF_NAME}.raw"

          # Generate checksums
          cd /tmp/out
          sha256sum * | tee "tinfoil-inference-${REF_NAME}-checksums.sha256"

          echo "digest=sha256:$(sha256sum "tinfoil-inference-${REF_NAME}-manifest.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Attest artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3.0.0
        with:
          subject-path: |
            /tmp/out/tinfoil-inference-${{ github.ref_name }}-manifest.json
            /tmp/out/tinfoil-inference-${{ github.ref_name }}.initrd
            /tmp/out/tinfoil-inference-${{ github.ref_name }}.vmlinuz
            /tmp/out/tinfoil-inference-${{ github.ref_name }}.raw

      - name: Upload artifact
        uses: ryand56/r2-upload-action@b801a390acbdeb034c5e684ff5e1361c06639e7c
        with:
          r2-account-id: ${{ secrets.R2_IMAGES_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_IMAGES_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_IMAGES_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_IMAGES_BUCKET }}
          source-dir: /tmp/out
          destination-dir: ./cvm

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          IS_PRERELEASE: ${{ steps.check-prerelease.outputs.is_prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$REF_NAME" \
            -R "$REPOSITORY" \
            $PRERELEASE_FLAG \
            --title "$REF_NAME" \
            --notes "### Downloads
          - Kernel: https://images.tinfoil.sh/cvm/tinfoil-inference-${REF_NAME}.vmlinuz
          - Initrd: https://images.tinfoil.sh/cvm/tinfoil-inference-${REF_NAME}.initrd
          - Disk: https://images.tinfoil.sh/cvm/tinfoil-inference-${REF_NAME}.raw

          ### Manifest
          \`\`\`json
          $(cat "/tmp/out/tinfoil-inference-${REF_NAME}-manifest.json")
          \`\`\`" \
            "/tmp/out/tinfoil-inference-${REF_NAME}-manifest.json" \
            "/tmp/out/tinfoil-inference-${REF_NAME}-checksums.sha256"
