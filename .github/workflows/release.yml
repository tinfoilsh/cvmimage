name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Release
    runs-on: large
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check if prerelease
        id: check-prerelease
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "WARN: This is a prerelease"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Build image
        env:
          PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -Eeuo pipefail
          /nix/var/nix/profiles/default/bin/nix-build \
            -I . -A shipping-image -o result

      - name: Generate manifest
        id: manifest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/out
          # Generate manifest JSON
          cat > "/tmp/out/tinfoil-inference-${REF_NAME}-manifest.json" << EOF
          {
            "version": "${REF_NAME}",
            "root": "$(tr -d '\n' < result/tinfoilcvm.roothash)",
            "initrd": "$(sha256sum result/tinfoilcvm.initrd | awk '{print $1}')",
            "kernel": "$(sha256sum result/tinfoilcvm.vmlinuz | awk '{print $1}')",
            "raw": "$(sha256sum result/tinfoilcvm.raw | awk '{print $1}')"
          }
          EOF

          # Copy artifacts with versioned names
          cp result/tinfoilcvm.initrd "/tmp/out/tinfoil-inference-${REF_NAME}.initrd"
          cp result/tinfoilcvm.vmlinuz "/tmp/out/tinfoil-inference-${REF_NAME}.vmlinuz"
          cp result/tinfoilcvm.raw "/tmp/out/tinfoil-inference-${REF_NAME}.raw"

          # Generate checksums
          cd /tmp/out
          sha256sum ./* | tee "tinfoil-inference-${REF_NAME}-checksums.sha256"

          echo "digest=sha256:$(sha256sum "tinfoil-inference-${REF_NAME}-manifest.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Attest artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3.0.0
        with:
          subject-path: |
            /tmp/out/tinfoil-inference-${{ github.ref_name }}-manifest.json
            /tmp/out/tinfoil-inference-${{ github.ref_name }}.initrd
            /tmp/out/tinfoil-inference-${{ github.ref_name }}.vmlinuz
            /tmp/out/tinfoil-inference-${{ github.ref_name }}.raw
            /tmp/out/tinfoil-inference-${{ github.ref_name }}-checksums.sha256

      - name: Upload attested artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_IMAGES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_IMAGES_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_IMAGES_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_IMAGES_BUCKET }}
        run: |
          set -Eeuo pipefail
          aws="$(/nix/var/nix/profiles/default/bin/nix-build \
            --no-out-link -I . -A release-upload-cli)/bin/aws"
          for file in /tmp/out/*; do
            "$aws" s3 cp "$file" \
              "s3://${R2_BUCKET}/cvm/$(basename "$file")" \
              --only-show-errors --no-progress
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          IS_PRERELEASE: ${{ steps.check-prerelease.outputs.is_prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$REF_NAME" \
            -R "$REPOSITORY" \
            $PRERELEASE_FLAG \
            --title "$REF_NAME" \
            --notes "### Downloads
          - Kernel: https://images.tinfoil.sh/cvm/tinfoil-inference-${REF_NAME}.vmlinuz
          - Initrd: https://images.tinfoil.sh/cvm/tinfoil-inference-${REF_NAME}.initrd
          - Disk: https://images.tinfoil.sh/cvm/tinfoil-inference-${REF_NAME}.raw

          ### Manifest
          \`\`\`json
          $(cat "/tmp/out/tinfoil-inference-${REF_NAME}-manifest.json")
          \`\`\`" \
            "/tmp/out/tinfoil-inference-${REF_NAME}-manifest.json" \
            "/tmp/out/tinfoil-inference-${REF_NAME}-checksums.sha256"
