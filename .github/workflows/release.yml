name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Release
    runs-on: large
    outputs:
      config-pin: ${{ steps.manifest-digest.outputs.config-pin }}
      prerelease: ${{ steps.check-prerelease.outputs.is_prerelease }}
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check if prerelease
        id: check-prerelease
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "WARN: This is a prerelease"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Build image
        env:
          PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -Eeuo pipefail
          /nix/var/nix/profiles/default/bin/nix-build \
            -I . -A shipping-image -o result

      - name: Build cvm-compiler
        env:
          PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -Eeuo pipefail
          /nix/var/nix/profiles/default/bin/nix-build \
            -I . -A cvm-compiler -o result-cvmc

      # One image per platform per release. The command line holds only what is
      # intrinsic to this image -- its own roothash and the kernel options it
      # always boots with -- so nothing about a workload enters the launch
      # measurement, and one published image serves every deployment. The RAM
      # size and processor count are launch arguments the digest does not cover
      # (firmware/src/acpi.rs builds the MADT at boot; SEV-SNP measures the boot
      # processor alone), so the values passed here do not pin a guest's shape.
      - name: Compile measured IGVM images
        env:
          PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -Eeuo pipefail
          roothash="$(tr -d '\n' < result/tinfoilcvm.roothash)"
          # Matches what the firmware path has booted for every release to
          # date. Three of these options look inert against this kernel
          # (CONFIG_DRM is unset, and readonly= is not a kernel parameter) but
          # they are inside a measured command line, so they are left alone
          # here and removed, if at all, as a change of their own.
          cmdline="readonly=on modprobe.blacklist=nouveau nouveau.modeset=0"
          cmdline="$cmdline root=/dev/mapper/root roothash=${roothash}"
          cmdline="$cmdline pci=noacpi pcie_ports=compat"
          echo "IGVM command line: $cmdline"
          echo "roothash=$roothash" >> "$GITHUB_ENV"
          for platform in snp tdx; do
            ./result-cvmc/bin/cvmc build \
              --platform "$platform" \
              --kernel result/tinfoilcvm.vmlinuz \
              --initramfs result/tinfoilcvm.initrd \
              --cmdline "$cmdline" \
              --output "tinfoil-${platform}.igvm"
          done

      # The digest a guest's own attestation report has to show. Taken from the
      # manifest cvmc writes, then recomputed from the image itself and compared,
      # so an image and a manifest that disagree cannot ship.
      - name: Read and cross-check the launch measurements
        run: |
          set -Eeuo pipefail
          field() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$1" "$2"; }
          snp_meas="$(field tinfoil-snp.igvm.manifest.json expected_snp_measurement)"
          tdx_meas="$(field tinfoil-tdx.igvm.manifest.json expected_mrtd)"
          snp_policy="$(field tinfoil-snp.igvm.manifest.json guest_policy)"
          jq -e '(.launch.measurement == .expected_snp_measurement and .launch.policy == .guest_policy) or error("SNP launch measurement or policy disagrees with the manifest")' tinfoil-snp.igvm.manifest.json > /dev/null
          jq -e '(.launch.mrtd == .expected_mrtd) or error("TDX launch MRTD disagrees with the manifest")' tinfoil-tdx.igvm.manifest.json > /dev/null

          # cvmc appends no5lvl, so the command line that was measured is the
          # one it recorded -- not the string composed above. Publishing the
          # latter would hand a verifier a line that does not reproduce the
          # digest beside it.
          igvm_cmdline="$(field tinfoil-snp.igvm.manifest.json command_line)"
          tdx_cmdline="$(field tinfoil-tdx.igvm.manifest.json command_line)"
          if [ "$igvm_cmdline" != "$tdx_cmdline" ]; then
            echo "::error::the two images measured different command lines"
            exit 1
          fi
          # H2: nothing else ties these measurements to the filesystem the same
          # manifest publishes as "root".
          case "$igvm_cmdline" in
            *"roothash=${roothash}"*) ;;
            *) echo "::error::measured command line does not carry roothash=${roothash}"; exit 1 ;;
          esac

          # M1: the policy is the only published value a verifier must pin and
          # the image does not enforce, so shape-check it the way the consumer does.
          if ! printf '%s' "$snp_policy" | grep -Eq '^(0x[0-9a-fA-F]{1,16}|[0-9]{1,20})$'; then
            echo "::error::guest policy is not a SEV-SNP policy: $snp_policy"
            exit 1
          fi

          # `cvmc measure` prints "platform: <p>" then "<field>: <hex>".
          recomputed() { ./result-cvmc/bin/cvmc measure "$1" | awk -F': ' 'NR==2 {print $2}'; }
          for pair in "snp:$snp_meas" "tdx:$tdx_meas"; do
            platform="${pair%%:*}"
            claimed="${pair#*:}"
            if ! printf '%s' "$claimed" | grep -Eq '^[0-9a-fA-F]{96}$'; then
              echo "::error::${platform} measurement is not 48 hexadecimal bytes: $claimed"
              exit 1
            fi
            actual="$(recomputed "tinfoil-${platform}.igvm")"
            if [ "$claimed" != "$actual" ]; then
              echo "::error::${platform} manifest says $claimed but the image measures $actual"
              exit 1
            fi
            echo "${platform}: $claimed"
          done

          {
            echo "igvm_cmdline=$igvm_cmdline"
          } >> "$GITHUB_ENV"

      - name: Generate manifest
        env:
          REF_NAME: ${{ github.ref_name }}
          IGVM_MANIFEST_FORMAT_VERSION: "1"
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/out
          mkdir -p /tmp/out
          snp_launch="$(jq -ce 'select(.format_version == 3) | .launch | {measurement}' tinfoil-snp.igvm.manifest.json)"
          tdx_launch="$(jq -ce 'select(.format_version == 3) | .launch | {mrtd, rtmr0, rtmr1, rtmr2, rtmr3}' tinfoil-tdx.igvm.manifest.json)"
          # Generate manifest JSON
          cat > "/tmp/out/tinfoil-inference-${REF_NAME}-manifest.json" << EOF
          {
            "version": "${REF_NAME}",
            "root": "$(tr -d '\n' < result/tinfoilcvm.roothash)",
            "initrd": "$(sha256sum result/tinfoilcvm.initrd | awk '{print $1}')",
            "kernel": "$(sha256sum result/tinfoilcvm.vmlinuz | awk '{print $1}')",
            "raw": "$(sha256sum result/tinfoilcvm.raw | awk '{print $1}')",
            "igvm": {
              "format_version": ${IGVM_MANIFEST_FORMAT_VERSION},
              "snp": "$(sha256sum tinfoil-snp.igvm | awk '{print $1}')",
              "tdx": "$(sha256sum tinfoil-tdx.igvm | awk '{print $1}')",
              "snp_launch": ${snp_launch},
              "tdx_launch": ${tdx_launch},
              "cmdline": $(jq -n --arg value "$igvm_cmdline" '$value')
            }
          }
          EOF

          # Copy artifacts with versioned names
          cp result/tinfoilcvm.initrd "/tmp/out/tinfoil-inference-${REF_NAME}.initrd"
          cp result/tinfoilcvm.vmlinuz "/tmp/out/tinfoil-inference-${REF_NAME}.vmlinuz"
          cp result/tinfoilcvm.raw "/tmp/out/tinfoil-inference-${REF_NAME}.raw"
          cp result-cvmc/bin/cvmc "/tmp/out/cvmc-${REF_NAME}"
          cp tinfoil-snp.igvm "/tmp/out/tinfoil-snp-${REF_NAME}.igvm"
          cp tinfoil-tdx.igvm "/tmp/out/tinfoil-tdx-${REF_NAME}.igvm"
          cp tinfoil-snp.igvm.manifest.json "/tmp/out/tinfoil-snp-${REF_NAME}.igvm.manifest.json"
          cp tinfoil-tdx.igvm.manifest.json "/tmp/out/tinfoil-tdx-${REF_NAME}.igvm.manifest.json"

          # Generate checksums
          cd /tmp/out
          sha256sum ./* | tee "tinfoil-inference-${REF_NAME}-checksums.sha256"

      - name: Hash the manifest
        id: manifest-digest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          manifest_sha256="$(sha256sum "/tmp/out/tinfoil-inference-${REF_NAME}-manifest.json" | awk '{print $1}')"
          echo "sha256=${manifest_sha256}" >> "$GITHUB_OUTPUT"
          echo "config-pin=${REF_NAME#v}@sha256:${manifest_sha256}" >> "$GITHUB_OUTPUT"

      - name: Attest artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3.0.0
        with:
          subject-path: |
            /tmp/out/tinfoil-inference-${{ github.ref_name }}-manifest.json
            /tmp/out/tinfoil-inference-${{ github.ref_name }}.initrd
            /tmp/out/tinfoil-inference-${{ github.ref_name }}.vmlinuz
            /tmp/out/tinfoil-inference-${{ github.ref_name }}.raw
            /tmp/out/cvmc-${{ github.ref_name }}
            /tmp/out/tinfoil-snp-${{ github.ref_name }}.igvm
            /tmp/out/tinfoil-tdx-${{ github.ref_name }}.igvm
            /tmp/out/tinfoil-snp-${{ github.ref_name }}.igvm.manifest.json
            /tmp/out/tinfoil-tdx-${{ github.ref_name }}.igvm.manifest.json
            /tmp/out/tinfoil-inference-${{ github.ref_name }}-checksums.sha256

      # The manifest is its own predicate: a verifier reads the launch
      # measurements from igvm.snp_launch and igvm.tdx_launch and ignores
      # the rest.
      - name: Attest the launch measurements
        uses: actions/attest@7667f588f2f73a90cea6c7ac70e78266c4f76616  # v3.1.0
        with:
          subject-name: tinfoil-inference-${{ github.ref_name }}-manifest.json
          subject-digest: sha256:${{ steps.manifest-digest.outputs.sha256 }}
          predicate-type: https://tinfoil.sh/predicate/snp-tdx-multiplatform/v2
          predicate-path: /tmp/out/tinfoil-inference-${{ github.ref_name }}-manifest.json

      - name: Upload attested artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_IMAGES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_IMAGES_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_IMAGES_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_IMAGES_BUCKET }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          aws="$(/nix/var/nix/profiles/default/bin/nix-build \
            --no-out-link -I . -A release-upload-cli)/bin/aws"
          manifest="/tmp/out/tinfoil-inference-${REF_NAME}-manifest.json"
          for file in /tmp/out/*; do
            if [ "$file" = "$manifest" ]; then
              continue
            fi
            "$aws" s3 cp "$file" \
              "s3://${R2_BUCKET}/cvm/$(basename "$file")" \
              --only-show-errors --no-progress
          done
          # Last: it is the index, and it names launch measurements for images
          # that have to exist before anything reads it.
          "$aws" s3 cp "$manifest" \
            "s3://${R2_BUCKET}/cvm/$(basename "$manifest")" \
            --only-show-errors --no-progress

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          IS_PRERELEASE: ${{ steps.check-prerelease.outputs.is_prerelease }}
          CONFIG_PIN: ${{ steps.manifest-digest.outputs.config-pin }}
        run: |
          set -Eeuo pipefail
          manifest="/tmp/out/tinfoil-inference-${REF_NAME}-manifest.json"
          snp_measurement="$(jq -er '.igvm.snp_launch.measurement' "$manifest")"
          tdx_measurement="$(jq -er '.igvm.tdx_launch.mrtd' "$manifest")"
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$REF_NAME" \
            -R "$REPOSITORY" \
            $PRERELEASE_FLAG \
            --title "$REF_NAME" \
            --notes "### Config
          Add this to your tinfoil-config.yml:
          \`\`\`yaml
          cvm-version: \"${CONFIG_PIN}\"
          \`\`\`

          ### Downloads
          - Kernel: https://images.tinfoil.sh/cvm/tinfoil-inference-${REF_NAME}.vmlinuz
          - Initrd: https://images.tinfoil.sh/cvm/tinfoil-inference-${REF_NAME}.initrd
          - Disk: https://images.tinfoil.sh/cvm/tinfoil-inference-${REF_NAME}.raw
          - CVM compiler (cvmc): https://images.tinfoil.sh/cvm/cvmc-${REF_NAME}
          - IGVM (SEV-SNP): https://images.tinfoil.sh/cvm/tinfoil-snp-${REF_NAME}.igvm
          - IGVM (TDX): https://images.tinfoil.sh/cvm/tinfoil-tdx-${REF_NAME}.igvm

          ### Launch measurements
          - SEV-SNP: \`${snp_measurement}\`
          - Intel TDX MRTD: \`${tdx_measurement}\`

          ### Manifest
          \`\`\`json
          $(cat "/tmp/out/tinfoil-inference-${REF_NAME}-manifest.json")
          \`\`\`" \
            "/tmp/out/tinfoil-inference-${REF_NAME}-manifest.json" \
            "/tmp/out/tinfoil-inference-${REF_NAME}-checksums.sha256"

  update-readme:
    name: Update README config example
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    concurrency:
      group: release-readme
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          latest=$(gh api "repos/${REPOSITORY}/releases/latest" --jq .tag_name)
          if [ "$latest" = "$REF_NAME" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: steps.latest.outputs.update == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Update config pin
        if: steps.latest.outputs.update == 'true'
        env:
          CONFIG_PIN: ${{ needs.release.outputs.config-pin }}
        run: |
          set -Eeuo pipefail
          test "$(grep -c '^cvm-version:' README.md)" -eq 1
          sed -i "s|^cvm-version:.*|cvm-version: \"${CONFIG_PIN}\"|" README.md

      - name: Create or update README pull request
        id: readme-pr
        if: steps.latest.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BRANCH: readme-update/cvm-version
        run: |
          set -Eeuo pipefail
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi

          gh auth setup-git
          previous_head=$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)
          git switch -c "$PR_BRANCH"
          title="docs: update CVM config example to $REF_NAME"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$title"
          git push --force-with-lease="refs/heads/$PR_BRANCH:$previous_head" \
            origin "HEAD:refs/heads/$PR_BRANCH"

          body_file="$RUNNER_TEMP/readme-pr-body.md"
          printf 'Pin the README config example to the runtime manifest published with %s.\n' \
            "$REF_NAME" > "$body_file"
          pr_url=$(gh pr list --head "$PR_BRANCH" --base "$BASE_BRANCH" \
            --state open --json url --jq '.[0].url // empty')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create --head "$PR_BRANCH" --base "$BASE_BRANCH" \
              --title "$title" --body-file "$body_file")
          else
            gh pr edit "$pr_url" --title "$title" --body-file "$body_file"
          fi
          echo "pull-request-url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pull-request-head-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge README update
        if: steps.readme-pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.readme-pr.outputs.pull-request-url }}
          PR_HEAD: ${{ steps.readme-pr.outputs.pull-request-head-sha }}
        run: |
          gh pr merge "$PR_URL" --rebase --delete-branch --match-head-commit "$PR_HEAD" ||
            echo "::warning::Could not merge README update automatically. Merge it manually: $PR_URL"
