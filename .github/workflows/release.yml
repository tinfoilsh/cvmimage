name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Release
    runs-on: large
    outputs:
      cpu-pin: ${{ steps.manifest-digest.outputs.cpu-pin }}
      gpu-pin: ${{ steps.manifest-digest.outputs.gpu-pin }}
      prerelease: ${{ steps.check-prerelease.outputs.is_prerelease }}
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check if prerelease
        id: check-prerelease
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "WARN: This is a prerelease"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Build images
        env:
          PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -Eeuo pipefail
          for variant in cpu gpu; do
            /nix/var/nix/profiles/default/bin/nix-build \
              -I . -A "variants.${variant}.shipping-image" -o "result-${variant}"
          done

      - name: Build cvm-compiler
        env:
          PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -Eeuo pipefail
          /nix/var/nix/profiles/default/bin/nix-build \
            -I . -A cvm-compiler -o result-cvmc

      - name: Compile and measure release variants
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          release_dir="$(mktemp -d "$RUNNER_TEMP/igvm-release.XXXXXX")/artifacts"
          bash image/release-igvm.sh "$REF_NAME" "$release_dir" \
            result-cpu result-gpu result-cvmc/bin/cvmc
          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"

      - name: Hash the manifests
        id: manifest-digest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          for variant in cpu gpu; do
            version="$REF_NAME"
            if [ "$variant" = gpu ]; then
              version="${REF_NAME}+gpu"
            fi
            digest="$(sha256sum "$RELEASE_DIR/tinfoil-inference-${version}-manifest.json" | awk '{print $1}')"
            echo "${variant}-pin=${version#v}@sha256:${digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Attest artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3.0.0
        with:
          subject-path: ${{ env.RELEASE_DIR }}/*

      - name: Upload attested artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_IMAGES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_IMAGES_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_IMAGES_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_IMAGES_BUCKET }}
        run: |
          set -Eeuo pipefail
          aws="$(/nix/var/nix/profiles/default/bin/nix-build \
            --no-out-link -I . -A release-upload-cli)/bin/aws"
          for file in "$RELEASE_DIR"/*; do
            if [[ "$file" == *-manifest.json ]]; then
              continue
            fi
            "$aws" s3 cp "$file" \
              "s3://${R2_BUCKET}/cvm/$(basename "$file")" \
              --only-show-errors --no-progress
          done
          # Publish manifests after the artifacts they reference.
          for manifest in "$RELEASE_DIR"/*-manifest.json; do
            "$aws" s3 cp "$manifest" \
              "s3://${R2_BUCKET}/cvm/$(basename "$manifest")" \
              --only-show-errors --no-progress
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          IS_PRERELEASE: ${{ steps.check-prerelease.outputs.is_prerelease }}
          CPU_PIN: ${{ steps.manifest-digest.outputs.cpu-pin }}
          GPU_PIN: ${{ steps.manifest-digest.outputs.gpu-pin }}
        run: |
          set -Eeuo pipefail
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          printf 'CPU image:\n\n    cvm-version: "%s"\n\nGPU image:\n\n    cvm-version: "%s"\n' "$CPU_PIN" "$GPU_PIN" > "$notes"
          gh release create "$REF_NAME" \
            -R "$REPOSITORY" \
            $PRERELEASE_FLAG \
            --title "$REF_NAME" --notes-file "$notes" \
            "$RELEASE_DIR/tinfoil-inference-${REF_NAME}-manifest.json" \
            "$RELEASE_DIR/tinfoil-inference-${REF_NAME}+gpu-manifest.json" \
            "$RELEASE_DIR/tinfoil-inference-${REF_NAME}-checksums.sha256"

  update-readme:
    name: Update README config example
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    concurrency:
      group: release-readme
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          latest=$(gh api "repos/${REPOSITORY}/releases/latest" --jq .tag_name)
          if [ "$latest" = "$REF_NAME" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: steps.latest.outputs.update == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Update config pin
        if: steps.latest.outputs.update == 'true'
        env:
          CPU_PIN: ${{ needs.release.outputs.cpu-pin }}
          GPU_PIN: ${{ needs.release.outputs.gpu-pin }}
        run: |
          set -Eeuo pipefail
          test "$(grep -c '^cvm-version:' README.md)" -eq 1
          CONFIG_PIN="$CPU_PIN"
          if grep -q '^cvm-version:.*+gpu@' README.md; then
            CONFIG_PIN="$GPU_PIN"
          fi
          sed -i "s|^cvm-version:.*|cvm-version: \"${CONFIG_PIN}\"|" README.md

      - name: Create or update README pull request
        id: readme-pr
        if: steps.latest.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BRANCH: readme-update/cvm-version
        run: |
          set -Eeuo pipefail
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi

          gh auth setup-git
          previous_head=$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)
          git switch -c "$PR_BRANCH"
          title="docs: update CVM config example to $REF_NAME"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$title"
          git push --force-with-lease="refs/heads/$PR_BRANCH:$previous_head" \
            origin "HEAD:refs/heads/$PR_BRANCH"

          body_file="$RUNNER_TEMP/readme-pr-body.md"
          printf 'Pin the README config example to the runtime manifest published with %s.\n' \
            "$REF_NAME" > "$body_file"
          pr_url=$(gh pr list --head "$PR_BRANCH" --base "$BASE_BRANCH" \
            --state open --json url --jq '.[0].url // empty')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create --head "$PR_BRANCH" --base "$BASE_BRANCH" \
              --title "$title" --body-file "$body_file")
          else
            gh pr edit "$pr_url" --title "$title" --body-file "$body_file"
          fi
          echo "pull-request-url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pull-request-head-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge README update
        if: steps.readme-pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.readme-pr.outputs.pull-request-url }}
          PR_HEAD: ${{ steps.readme-pr.outputs.pull-request-head-sha }}
        run: |
          gh pr merge "$PR_URL" --rebase --delete-branch --match-head-commit "$PR_HEAD" ||
            echo "::warning::Could not merge README update automatically. Merge it manually: $PR_URL"
