name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          go-version: '1.25'

      - name: Build
        run: cd tinfoil && go build ./...

      - name: Test
        run: cd tinfoil && go test ./...

      # Static TCB policy checks. Must stay green on every commit: an image
      # with a forbidden rootfs/initrd payload or a weakened source policy
      # fails here before it can be merged. (Built-image checks run in the
      # release flow where a rootfs is available.)
      - name: TCB checks (static)
        run: ./tcb-check.sh
