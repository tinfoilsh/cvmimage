name: Test

on:
  pull_request:
    branches: [main, jules/harden-tcb, jules/tcb-bazel-runtime-lock, jules/tcb-bazel-rootfs]
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          go-version: '1.25'

      - name: Install Bazel 8.7.0
        shell: bash
        run: |
          set -Eeuo pipefail
          directory=$(mktemp -d /tmp/cvmimage-bazel-install.XXXXXXXX)
          archive="$directory/bazel"
          trap 'rm -f -- "$archive"; rmdir -- "$directory"' EXIT
          curl -fsSL --retry 3 \
            https://github.com/bazelbuild/bazel/releases/download/8.7.0/bazel-8.7.0-linux-x86_64 \
            -o "$archive"
          printf '%s  %s\n' \
            d7606e679b78067c811096fb3d6cf135225b528835ca396e3a4dddf957859544 \
            "$archive" | sha256sum -c --strict -
          sudo install -m 0755 "$archive" /usr/local/bin/bazel
          test "$(bazel --version)" = "bazel 8.7.0"

      - name: Prepare archive gate sandbox
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes apparmor bubblewrap
          profile=/etc/apparmor.d/bwrap-userns-restrict
          test -f "$profile"
          sudo /usr/sbin/apparmor_parser --replace "$profile"
          host_uid=$(id -u)
          host_gid=$(id -g)
          /usr/bin/env -i /usr/bin/bwrap \
            --clearenv \
            --unshare-user \
            --uid 0 \
            --gid 0 \
            --unshare-pid \
            --unshare-ipc \
            --unshare-uts \
            --unshare-net \
            --die-with-parent \
            --new-session \
            --ro-bind / / \
            --proc /proc \
            --dev /dev \
            -- /bin/sh -eu -c '
              read uid_inside uid_outside uid_length < /proc/self/uid_map
              read gid_inside gid_outside gid_length < /proc/self/gid_map
              [ "${uid_inside}:${uid_outside}:${uid_length}" = "0:${1}:1" ]
              [ "${gid_inside}:${gid_outside}:${gid_length}" = "0:${2}:1" ]
            ' archive-gate-preflight "$host_uid" "$host_gid"

      - name: Build
        run: cd tinfoil && go build ./...

      - name: Test
        run: cd tinfoil && go test ./...

      - name: Test direct roothash contract
        run: ./scripts/test-roothash-artifacts.sh

      - name: Test fixed rootfs policy
        run: make test-rootfs-policy

      - name: Test Fabric Manager config contract
        run: ./scripts/test-fabric-manager-config.sh

      - name: Test rootfs manifest security
        run: sudo make test-rootfs-manifest

      - name: Test final rootfs verifier
        run: make test-final-rootfs-verifier

      - name: Test final rootfs archive gate safety
        run: bazel test //scripts:rootfs-archive-gate-test

      - name: Test runtime source and package-member locks
        run: make test-runtime-locks

      - name: Test exact runtime archive extraction and package data
        run: make test-runtime-archives

      - name: Test rootfs artifact contract
        run: make test-rootfs-artifacts

      - name: Verify all runtime locks
        run: make verify-runtime-sources

      - name: Test nvattest artifact safety
        run: make test-nvattest-artifacts
