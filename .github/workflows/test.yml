name: Test

on:
  pull_request:
    branches: [main, jules/harden-tcb]
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          go-version: '1.25.12'

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Check isolated Nixpkgs evaluation
        shell: bash
        run: |
          set -Eeuo pipefail
          nix_instantiate=/nix/var/nix/profiles/default/bin/nix-instantiate
          baseline="$("$nix_instantiate" --no-gc-warning -A runtime-go)"
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          mkdir -p "$test_home/.config/nixpkgs/overlays"
          printf '%s\n' 'throw "user overlay affected evaluation"' > \
            "$test_home/.config/nixpkgs/overlays/default.nix"
          printf '%s\n' 'throw "user config affected evaluation"' > \
            "$test_home/nixpkgs-config.nix"
          configured="$(HOME="$test_home" \
            NIXPKGS_CONFIG="$test_home/nixpkgs-config.nix" \
            "$nix_instantiate" --no-gc-warning -A runtime-go)"
          test "$configured" = "$baseline"

      - name: Test
        shell: bash
        env:
          PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -Eeuo pipefail
          make test
          for target in runtime-go debug-init tinfoil-initrd fixed-cpio-writer initrd nvattest; do
            /nix/var/nix/profiles/default/bin/nix-build \
              --no-out-link -A "$target"
          done
