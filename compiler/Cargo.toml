[package]
name = "cvm-compiler"
version = "0.1.0"
edition = "2021"
description = "Compiles the Tinfoil firmware, kernel and initramfs into a measured CVM image"

[[bin]]
name = "cvmc"
path = "src/main.rs"

[dependencies]
tinfoil-firmware = { path = "../firmware" }
clap = { version = "=4.5.41", features = ["derive"] }
hex = "=0.4.3"
igvm = "=0.3.4"
igvm_defs = "=0.3.4"
p384 = { version = "=0.13.1", default-features = false, features = ["ecdsa", "pkcs8", "pem"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
zerocopy = "=0.7.32"

[dev-dependencies]
tempfile = "=3.20.0"
# Feature resolver 2 keeps this out of the release binary; see firmware/src/shim.rs.
tinfoil-firmware = { path = "../firmware", features = ["harness"] }
