[Distribution]
Distribution=custom

[Output]
Format=disk
Output=tinfoilcvm
SplitArtifacts=roothash
# systemd-repart derives the dm-verity salt as
# HMAC-SHA256(Seed, "verity-salt"). Keep this synchronized with
# tinfoil/cmd/initrd so no verity superblock fields enter the runtime TCB.
Seed=48c56959-5579-5709-85af-f5393936a4d8

[Content]
CleanPackageMetadata=no
SourceDateEpoch=0
Bootable=no
Bootloader=none
UnifiedKernelImages=no
KernelModulesInitrd=no

[Build]
WithNetwork=no
Incremental=no
RepartOffline=yes
