[Config]
Dependencies=initrd

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main restricted universe multiverse

[Output]
Format=disk
Output=tinfoilcvm

[Content]
Hostname=tinfoil
Bootable=yes
Initrds=initrd
PackageDirectories=packages
RootPassword=!
Bootloader=uki
KernelModulesInitrd=no
# The Tinfoil initrd requires an explicit dm-target module mode. "builtin"
# means dm-verity/dm-bufio are compiled into the (custom) kernel; a stock
# modular kernel must instead stage the bounded module manifest and pass
# tinfoil-initrd-modules=manifest. Absent this flag the initrd fails closed
# rather than assuming targets are present.
KernelCommandLine=tinfoil-initrd-modules=builtin
WithDocs=false
CleanPackageMetadata=true
WithRecommends=false
Packages=
    systemd-boot-efi
    build-essential
    patch
    iproute2
    ca-certificates
    nftables
    iptables
    cryptsetup
    linux-generic
    linux-headers-generic
    nvidia-driver-open=595.71.05-1ubuntu1
    nvidia-persistenced=595.71.05-1ubuntu1
    nvidia-fabricmanager=595.71.05-1ubuntu1
    libnvidia-nscq=595.71.05-1ubuntu1
    nvattest=1.2.2.1780962352-1
    nvidia-container-toolkit=1.19.1-1

[Build]
ToolsTree=default
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=resolute
WithNetwork=yes
Incremental=yes
