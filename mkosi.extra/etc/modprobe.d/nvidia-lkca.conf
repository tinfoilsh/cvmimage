# Document the B300 full-CC NVIDIA module parameters that Tinfoil PID1 passes
# directly through finit_module. /var/tmp is mounted as tmpfs by Tinfoil PID1
# before loading the driver, so this does not require writable measured root
# state. This file must not contain install/remove hooks: no modprobe exists
# in the image and PID1 loads the bounded module closure (including the
# ECDSA/ECDH SPDM prerequisites) directly.
options nvidia NVreg_TemporaryFilePath=/var/tmp NVreg_EnableS0ixPowerManagement=1 NVreg_PreserveVideoMemoryAllocations=1
